name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Honors .npmrc legacy-peer-deps. postinstall runs `prisma generate`,
      # which needs no database connection.
      - name: Install dependencies
        run: npm ci

      - name: Schema + webhook-adapter tests (offline)
        run: npm test

      - name: Unit tests (offline)
        run: npm run test:unit

      - name: Stripe webhook logic tests (offline)
        run: npm run test:webhook

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # LLM/Supabase clients are constructed lazily, so the build needs only
      # placeholder public env values.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
